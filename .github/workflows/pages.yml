name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEMBERS_SHEET_CSV_URL: ${{ secrets.MEMBERS_SHEET_CSV_URL }}
      MEMBERS_SHEET_ID: ${{ secrets.MEMBERS_SHEET_ID }}
      MEMBERS_SHEET_GID: ${{ secrets.MEMBERS_SHEET_GID }}
      RESEARCH_SHEET_CSV_URL: ${{ secrets.RESEARCH_SHEET_CSV_URL }}
      RESEARCH_SHEET_ID: ${{ secrets.RESEARCH_SHEET_ID }}
      RESEARCH_SHEET_GID: ${{ secrets.RESEARCH_SHEET_GID }}
      EVENTS_SHEET_CSV_URL: ${{ secrets.EVENTS_SHEET_CSV_URL }}
      EVENTS_SHEET_ID: ${{ secrets.EVENTS_SHEET_ID }}
      EVENTS_SHEET_GID: ${{ secrets.EVENTS_SHEET_GID }}
      PUBLICATIONS_SHEET_CSV_URL: ${{ secrets.PUBLICATIONS_SHEET_CSV_URL }}
      PUBLICATIONS_SHEET_ID: ${{ secrets.PUBLICATIONS_SHEET_ID }}
      PUBLICATIONS_SHEET_GID: ${{ secrets.PUBLICATIONS_SHEET_GID }}
      NEWS_SHEET_CSV_URL: ${{ secrets.NEWS_SHEET_CSV_URL }}
      NEWS_SHEET_ID: ${{ secrets.NEWS_SHEET_ID }}
      NEWS_SHEET_GID: ${{ secrets.NEWS_SHEET_GID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Sync members from Google Sheets
        if: ${{ env.MEMBERS_SHEET_CSV_URL != '' || env.MEMBERS_SHEET_ID != '' }}
        run: ruby scripts/sync_members_from_sheet.rb
      - name: Sync research from Google Sheets
        if: ${{ env.RESEARCH_SHEET_CSV_URL != '' || env.RESEARCH_SHEET_ID != '' }}
        run: ruby scripts/sync_research_from_sheet.rb
      - name: Sync events from Google Sheets
        if: ${{ env.EVENTS_SHEET_CSV_URL != '' || env.EVENTS_SHEET_ID != '' }}
        run: ruby scripts/sync_events_from_sheet.rb
      - name: Sync publications from Google Sheets
        if: ${{ env.PUBLICATIONS_SHEET_CSV_URL != '' || env.PUBLICATIONS_SHEET_ID != '' }}
        run: ruby scripts/sync_publications_from_sheet.rb
      - name: Sync news from Google Sheets
        if: ${{ env.NEWS_SHEET_CSV_URL != '' || env.NEWS_SHEET_ID != '' }}
        run: ruby scripts/sync_news_from_sheet.rb
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
