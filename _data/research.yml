---
- id: program-analysis-verification
  area: Program Analysis and Verification
  title: プログラム解析・プログラム検証
  summary: 数理的手法に基づく高品質なソフトウェアの開発を目指します．
  description: プログラムはとにかく動けばよいというわけではありません。「どんな入力を与えても必ず停止する」など、開発者の意図したとおりに振る舞うことが重要です。このような性質を満たすことを保証するためには、どうすればよいでしょうか。すべての入力についてテストすればよいと思うかもしれません。入力のドメインが小さい場合はそれもよいでしょう。しかし、一般的には入力は無限にあり、すべてをチェックすることなど到底不可能です。結縁・中澤研究室では、プログラムが特定の性質を満たすことを数理的な手法を用いて証明する研究を行っています。具体的には、モデル検査、抽象解釈、型システムなどについて研究しています。証明と言っても、高校数学のように人間が頭を捻って考えるばかりではなく、コンピュータを使って自動化できることも多くあります。このような研究は高品質なソフトウェアを開発するために非常に重要です。
  order: 1
- id: reversible-concurrent-programming
  area: Reversible Concurrent Programming
  title: 可逆並行プログラミング
  summary: 可逆実行による振舞い解析手法を確立します．
  description: プログラムを実行するときには、計算が進行するに従って不要となった情報を忘れます。設計通りに動作しなかったときには、その原因は忘れた情報に含まれます。プログラムを可逆的に実行するためには、実行に使われた情報を保存しておく必要があり、実行の際に通常では不要な情報も保存します。可逆計算の概念は、実行として必要十分な情報を定義します。この考えに基づいて、デバッグなどによってソフトウェア、特に、並行性をもつソフトウェアに対する信頼性向上の枠組みを研究しています。
  order: 2
- id: realtime-concurrent-software
  area: Real-time Concurrent Software
  title: 実時間並行ソフトウェア開発手法
  summary: 時間に依存したソフトウェアを検証する手法を開発します．
  description: 実世界で使用されているシステムの多くは、同時並行的に動作する複数のシステムの組み合わせで構成されています。多くの場合、それぞれのシステムは「ある時間までに処理を完了しなければならない」といった時間的な制約を満たす必要があります。これらのシステムがCPUやメモリなどの資源を共有して動作するとき、正しく振る舞うかどうかを調べるのは難しい問題です。結縁・中澤研究室では、“動作の正しさが保証されている”実時間並行システムを“コストを抑えて”開発する手法を研究しています。主な研究分野は、プロセス代数や時間オートマトンなどの形式的手法の基礎理論、およびそれらの形式的手法に基づく開発手法、モデル化、モデル検査、コード生成などです。
  order: 3
