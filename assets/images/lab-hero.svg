<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Theoretical programming research visual</title>
  <desc id="desc">A stylized theorem board, typed program fragment, parallel process graph, and mathematical notation suggesting theoretical computer science research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7f4f2"/>
      <stop offset="0.55" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#e3edf7"/>
    </linearGradient>
    <linearGradient id="window" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f9fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#17212b" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="680" rx="36" fill="url(#bg)"/>
  <g opacity="0.17" fill="none" stroke="#164954" stroke-width="2">
    <path d="M88 126h112m-56-56v112"/>
    <path d="M768 92l78 78-78 78"/>
    <path d="M254 560c88-78 164-78 252 0s166 78 248 0"/>
    <path d="M96 446h184M680 420h184"/>
    <path d="M124 302l72-54 76 62 92-98 88 68" stroke-dasharray="8 10"/>
    <path d="M684 586l48-82 52 82h-100z"/>
  </g>
  <g fill="#17212b" opacity="0.16" font-family="Georgia, 'Times New Roman', serif" font-size="30">
    <text x="92" y="214">λx. f x</text>
    <text x="654" y="124">Γ ⊢ e : τ</text>
    <text x="112" y="596">∀ε &gt; 0</text>
    <text x="690" y="620">QED</text>
    <text x="396" y="620">P ∥ Q</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="118" y="88" width="724" height="504" rx="28" fill="url(#window)"/>
    <rect x="118" y="88" width="724" height="62" rx="28" fill="#17324d"/>
    <path d="M118 122h724" stroke="#17324d" stroke-width="56"/>
    <circle cx="164" cy="119" r="10" fill="#f07167"/>
    <circle cx="198" cy="119" r="10" fill="#ffd166"/>
    <circle cx="232" cy="119" r="10" fill="#70c1b3"/>
    <rect x="276" y="108" width="176" height="22" rx="11" fill="#294c68"/>
    <rect x="154" y="184" width="430" height="288" rx="18" fill="#17212b"/>
    <rect x="176" y="204" width="162" height="34" rx="8" fill="#22364a"/>
    <text x="198" y="228" fill="#d8e6ff" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">Typed calculus</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">
      <text x="188" y="276" fill="#70c1b3">theorem</text>
      <text x="302" y="276" fill="#f5f7fa">soundness:</text>
      <text x="212" y="322" fill="#d8e6ff">spawn p</text>
      <text x="316" y="322" fill="#f3b85b">∥</text>
      <text x="344" y="322" fill="#d8e6ff">spawn q</text>
      <text x="212" y="368" fill="#70c1b3">proof</text>
      <text x="286" y="368" fill="#f5f7fa">by simulation</text>
      <text x="212" y="414" fill="#557a95">case Send | Recv | Join</text>
    </g>
    <rect x="620" y="184" width="178" height="114" rx="18" fill="#edf4f7" stroke="#d9e2e8"/>
    <text x="648" y="226" fill="#164954" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">proc A</text>
    <path d="M646 252h54" stroke="#70c1b3" stroke-width="6" stroke-linecap="round"/>
    <path d="M714 252h44" stroke="#9ab3c7" stroke-width="6" stroke-linecap="round"/>
    <text x="652" y="278" fill="#557a95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">send c!</text>
    <rect x="620" y="338" width="178" height="114" rx="18" fill="#edf4f7" stroke="#d9e2e8"/>
    <text x="652" y="380" fill="#164954" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">proc B</text>
    <path d="M650 407h46" stroke="#9ab3c7" stroke-width="7" stroke-linecap="round"/>
    <path d="M710 407h54" stroke="#70c1b3" stroke-width="7" stroke-linecap="round"/>
    <text x="652" y="432" fill="#557a95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">recv c?</text>
    <rect x="620" y="492" width="178" height="56" rx="18" fill="#edf4f7" stroke="#d9e2e8"/>
    <text x="650" y="528" fill="#164954" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700">sync / join</text>
    <g fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round" opacity="0.68">
      <path d="M584 284C612 264 602 242 620 242"/>
      <path d="M584 348C612 376 602 394 620 394"/>
      <path d="M584 424C616 490 598 520 620 520"/>
      <path d="M710 298C742 314 742 322 710 338"/>
      <path d="M710 452C742 468 742 476 710 492"/>
      <path d="M798 242C824 284 824 350 798 394"/>
      <path d="M798 394C824 438 824 486 798 520"/>
    </g>
    <g fill="#17324d">
      <circle cx="584" cy="284" r="9"/>
      <circle cx="584" cy="348" r="9"/>
      <circle cx="584" cy="424" r="9"/>
      <circle cx="620" cy="242" r="9"/>
      <circle cx="620" cy="394" r="9"/>
      <circle cx="620" cy="520" r="9"/>
      <circle cx="709" cy="298" r="7"/>
      <circle cx="709" cy="338" r="7"/>
      <circle cx="709" cy="452" r="7"/>
      <circle cx="709" cy="492" r="7"/>
    </g>
    <rect x="154" y="504" width="430" height="38" rx="12" fill="#eef5f3"/>
    <text x="184" y="530" fill="#164954" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">λ-calculus / proof assistant</text>
  </g>
</svg>
